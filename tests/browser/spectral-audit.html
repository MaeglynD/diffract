<!doctype html><meta charset="utf-8"><title>Field reconstruction audit</title><style>body{background:#071119;color:#bcd7e0;font:14px monospace;padding:24px}pre{white-space:pre-wrap}</style><h1>Field reconstruction audit</h1><p>Compares every reconstructed sample with the reference volumes. This local check reads the full library; it does not run during normal viewing.</p><pre id="result">Starting…</pre><script type="module">const worker=new Worker('./spectral-audit.worker.mjs',{type:'module'});worker.onmessage=({data})=>{document.querySelector('#result').textContent=JSON.stringify(data,null,2);if(data.done)document.body.dataset.passed=String(data.passed);};worker.onerror=e=>document.querySelector('#result').textContent=e.message;worker.postMessage({id:new URLSearchParams(location.search).get('id')||'all'});</script>
